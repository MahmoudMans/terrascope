services:
  postgres:
    image: postgres:17-alpine
    container_name: terrascope-postgres
    environment:
      POSTGRES_DB: terrascope
      POSTGRES_USER: terrascope
      POSTGRES_PASSWORD: terrascope_demo
    ports:
      - "55433:5432"
    volumes:
      - terrascope_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U terrascope -d terrascope
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./apps/backend
    container_name: terrascope-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: terrascope
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:${WEB_PORT:-3000}}
      TERRASCOPE_SECURITY_ENABLED: ${TERRASCOPE_SECURITY_ENABLED:-false}
      TERRASCOPE_SECURITY_TOKEN_SECRET: ${TERRASCOPE_SECURITY_TOKEN_SECRET:-}
      TERRASCOPE_SECURITY_TOKEN_TTL: ${TERRASCOPE_SECURITY_TOKEN_TTL:-PT8H}
      TERRASCOPE_SECURITY_ADMIN_USERNAME: ${TERRASCOPE_SECURITY_ADMIN_USERNAME:-}
      TERRASCOPE_SECURITY_ADMIN_PASSWORD: ${TERRASCOPE_SECURITY_ADMIN_PASSWORD:-}
      TERRASCOPE_ACTIVITY_RETENTION_DAYS: ${TERRASCOPE_ACTIVITY_RETENTION_DAYS:-180}
      INGESTION_ENABLED: ${INGESTION_ENABLED:-true}
      INGESTION_EVALUATE_ALERTS: ${INGESTION_EVALUATE_ALERTS:-true}
      INGESTION_INTERVAL: ${INGESTION_INTERVAL:-PT2M}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8087}:8087"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8087/actuator/health | grep -q UP
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8087}/api/v1}
    container_name: terrascope-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/ > /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  terrascope_postgres_data:
